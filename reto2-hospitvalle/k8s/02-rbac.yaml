apiVersion: v1
kind: ServiceAccount
metadata:
  name: uci-db-sa
  namespace: hospitvalle
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: uci-config
  namespace: hospitvalle
data:
  SERVICIO: "UCI Adultos"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: uci-db-lectura-config
  namespace: hospitvalle
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["uci-config"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: uci-db-lectura-config
  namespace: hospitvalle
subjects:
  - kind: ServiceAccount
    name: uci-db-sa
    namespace: hospitvalle
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: uci-db-lectura-config
