events {}
http {
  server {
    listen 8443 ssl;
    server_name ingress.metromio.net;

    # Solo TLS 1.3
    ssl_protocols TLSv1.3;

    # Identidad del servidor
    ssl_certificate     /etc/nginx/pki/ingress.crt;
    ssl_certificate_key /etc/nginx/pki/ingress.key;

    # mTLS: exigir certificado de cliente firmado por la CA interna
    ssl_client_certificate /etc/nginx/pki/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    location /telemetria {
      default_type application/json;
      return 200 '{"estado": "aceptado", "cliente": "$ssl_client_s_dn", "verificacion": "$ssl_client_verify"}\n';
    }
  }
}
